version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: inventory-ai-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: inventory-ai
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - inventory-network

  # Node.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory-ai-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/inventory-ai
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: 7d
      ML_SERVICE_URL: http://ml-service:8000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - inventory-network

  # Python ML Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: inventory-ai-ml-service
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      MODEL_PATH: /app/models
      DATA_PATH: /app/data
    volumes:
      - ml_models:/app/models
    healthcheck:
      test: ['CMD', 'python', '-c', 'import httpx; httpx.get("http://localhost:8000/health")']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - inventory-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: inventory-ai-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - inventory-network

volumes:
  mongodb_data:
  ml_models:

networks:
  inventory-network:
    driver: bridge
